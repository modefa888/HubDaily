<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 用绝对路径，避免访问 /video/share?s=xxx（无结尾斜杠）时相对路径解析到 /favicon.ico 而丢图标 -->
    <link rel="icon" href="/video/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/video/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/video/favicon.ico">
    <title>分享播放</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- 与主站一致：矢量图标 + 自定义播放器 -->
    <script src="/video/js/icons.js"></script>
    <link rel="stylesheet" href="/video/css/video.css">
    <script src="/video/js/custom-video-player.js"></script>
    <style>
        body {
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 45%, #0b1220 100%);
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(circle at 20% 10%, rgba(59, 130, 246, 0.12), transparent 45%),
                radial-gradient(circle at 80% 20%, rgba(56, 189, 248, 0.10), transparent 40%),
                radial-gradient(circle at 50% 100%, rgba(15, 23, 42, 0.6), transparent 55%);
            pointer-events: none;
            z-index: 0;
        }
        .page-wrap {
            position: relative;
            z-index: 1;
        }
        /* 播放器右上角操作按钮（与主站播放器一致） */
        .sp-player-actions {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 6;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sp-top-btn {
            width: 2.4rem;
            height: 2.4rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .22);
            background: rgba(15, 23, 42, .58);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .38);
            backdrop-filter: blur(10px);
            transition: transform .18s ease, background .18s ease, box-shadow .18s ease, border-color .18s ease;
        }
        .sp-top-btn svg { width: 18px; height: 18px; }
        .sp-top-btn:hover {
            transform: translateY(-1px) scale(1.06);
            background: rgba(30, 41, 59, .84);
            border-color: rgba(255, 255, 255, .36);
        }
        .sp-top-btn:active { transform: scale(.94); }
        .sp-top-btn[data-icon="copy"] { background: linear-gradient(135deg, #a78bfa, #6d28d9); }
        /* 集数胶囊 */
        .sp-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 30px;
            padding: 0 6px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1;
            color: #e2e8f0;
            background: rgba(255, 255, 255, .07);
            border: 1px solid rgba(255, 255, 255, .12);
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            cursor: pointer;
            transition: background .16s ease, border-color .16s ease, transform .16s ease, box-shadow .16s ease, color .16s ease;
        }
        .sp-chip:not(.active):hover {
            color: #fff;
            background: rgba(96, 165, 250, .22);
            border-color: rgba(96, 165, 250, .6);
            box-shadow: 0 4px 12px rgba(37, 99, 235, .22);
            transform: translateY(-1px);
        }
        .sp-chip.active,
        .sp-chip.active:hover {
            color: #fff;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(37, 99, 235, .35);
            transform: none;
        }
        body.light-mode .sp-chip:not(.active) {
            color: #0f172a;
            background: rgba(15, 23, 42, .06);
            border-color: rgba(15, 23, 42, .12);
        }
        body.light-mode .sp-chip:not(.active):hover {
            color: #1d4ed8;
            background: rgba(37, 99, 235, .12);
            border-color: rgba(37, 99, 235, .5);
            box-shadow: 0 4px 12px rgba(37, 99, 235, .18);
        }
        body.light-mode .sp-chip.active,
        body.light-mode .sp-chip.active:hover {
            color: #fff;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-color: transparent;
        }
        /* 顶部纯图标按钮 */
        #themeToggle,
        #shareButton {
            width: 32px;
            height: 32px;
            padding: 0;
            border-radius: 9999px;
            transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
        }
        #themeToggle i,
        #shareButton i { font-size: 13px; }
        #themeToggle:hover,
        #shareButton:hover { transform: translateY(-1px); }
        /* 字段彩色 */
        .sp-label { color: #64748b; }
        .sp-source-value {
            color: #2563eb;
            font-weight: 600;
        }
        /* 覆盖浅色模式下卡片内文字统一变深色的规则 */
        body.light-mode .sp-label { color: #64748b; }
        body.light-mode .sp-source-value { color: #2563eb; }
        #playerTitle {
            background: linear-gradient(90deg, #6366f1, #0ea5e9 55%, #10b981);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }
        #shareCountdown { font-weight: 600; }
        #shareCountdown.is-permanent { color: #059669; }
        #shareCountdown.is-live { color: #d97706; }
        #shareCountdown.is-expired { color: #dc2626; }
        body:not(.light-mode) .sp-label { color: #94a3b8; }
        body:not(.light-mode) .sp-source-value { color: #93c5fd; }
        body:not(.light-mode) #shareCountdown.is-permanent { color: #34d399; }
        body:not(.light-mode) #shareCountdown.is-live { color: #fbbf24; }
        body:not(.light-mode) #shareCountdown.is-expired { color: #f87171; }
        /* 选集列表自定义滚动条 */
        #spEpisodeList {
            scrollbar-width: thin;
            scrollbar-color: rgba(148, 163, 184, .5) transparent;
        }
        #spEpisodeList::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        #spEpisodeList::-webkit-scrollbar-track {
            background: transparent;
        }
        #spEpisodeList::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, .45);
            border-radius: 999px;
        }
        #spEpisodeList::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, .75);
        }
        #spEpisodeList::-webkit-scrollbar-button {
            display: none;
            width: 0;
            height: 0;
        }
        body.light-mode #spEpisodeList {
            scrollbar-color: rgba(15, 23, 42, .28) transparent;
        }
        body.light-mode #spEpisodeList::-webkit-scrollbar-thumb {
            background: rgba(15, 23, 42, .25);
        }
        body.light-mode #spEpisodeList::-webkit-scrollbar-thumb:hover {
            background: rgba(15, 23, 42, .5);
        }
        /* 轻提示 */
        .sp-toast {
            position: fixed;
            left: 50%;
            bottom: 48px;
            transform: translateX(-50%) translateY(8px);
            background: rgba(15, 23, 42, .92);
            color: #fff;
            font-size: 12px;
            padding: 8px 14px;
            border-radius: 9999px;
            opacity: 0;
            transition: opacity .2s ease, transform .2s ease;
            z-index: 200;
            pointer-events: none;
        }
        .sp-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        body.light-mode {
            background: radial-gradient(circle at top, #ffffff 0%, #f1f5f9 45%, #e2e8f0 100%);
            color: #0f172a;
        }
        body.light-mode::before {
            background-image:
                radial-gradient(circle at 20% 10%, rgba(59, 130, 246, 0.10), transparent 45%),
                radial-gradient(circle at 80% 20%, rgba(14, 116, 144, 0.08), transparent 40%),
                radial-gradient(circle at 50% 100%, rgba(148, 163, 184, 0.35), transparent 55%);
        }
        body.light-mode .bg-slate-900\/70,
        body.light-mode .bg-slate-800\/60 {
            background-color: rgba(226, 232, 240, 0.7);
        }
        body.light-mode .text-white {
            color: #0f172a;
        }
        body.light-mode .text-slate-300,
        body.light-mode .text-slate-400,
        body.light-mode .text-slate-200 {
            color: #334155;
        }
        body.light-mode .text-blue-300 {
            color: #2563eb;
        }
        body.light-mode .bg-slate-900\/70,
        body.light-mode .bg-slate-900\/70 * {
            color: #0f172a;
        }
        /* 自定义播放器内部保持深色配色，避免浅色模式把控件文字/图标染黑 */
        body.light-mode .cvp { color: #ffffff; }
        body.light-mode .cvp * { color: inherit; }
        
        /* 手机版本优化 */
        @media (max-width: 640px) {
            .max-w-5xl {
                max-width: 100%;
            }
            .px-4 {
                padding-left: 0.75rem;
                padding-right: 0.75rem;
            }
            .py-6 {
                padding-top: 1rem;
                padding-bottom: 1rem;
            }
            .w-36 {
                width: 28%;
            }
            .h-48 {
                height: 36%;
            }
            .text-lg {
                font-size: 1rem;
            }
            .text-xl {
                font-size: 1.125rem;
            }
            .text-sm {
                font-size: 0.875rem;
            }
            .text-xs {
                font-size: 0.75rem;
            }
            .p-4 {
                padding: 1rem;
            }
            .p-3 {
                padding: 0.75rem;
            }
            .mb-4 {
                margin-bottom: 1rem;
            }
            .mb-3 {
                margin-bottom: 0.75rem;
            }
            .mt-3 {
                margin-top: 0.75rem;
            }
            .mt-4 {
                margin-top: 1rem;
            }
            .space-x-4 {
                gap: 1rem;
            }
            .space-x-3 {
                gap: 0.75rem;
            }
            .space-x-2 {
                gap: 0.5rem;
            }
            .gap-2 {
                gap: 0.5rem;
            }
            .grid-cols-2 {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }
            .max-h-28 {
                max-height: 20vh;
            }
            
            /* 播放器适配 */
            .sp-top-btn {
                width: 2.1rem;
                height: 2.1rem;
            }
            .sp-top-btn svg {
                width: 16px;
                height: 16px;
            }
            
            /* 按钮适配 */
            .px-3 {
                padding-left: 0.5rem;
                padding-right: 0.5rem;
            }
            .py-1 {
                padding-top: 0.25rem;
                padding-bottom: 0.25rem;
            }
            
            /* 标题适配 */
            h1.text-lg {
                font-size: 0.875rem;
            }
            
            /* 底部导航 */
            .mobile-nav {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background-color: rgba(15, 23, 42, 0.9);
                backdrop-filter: blur(10px);
                border-top: 1px solid rgba(255, 255, 255, 0.1);
                padding: 0.75rem;
                display: flex;
                justify-content: space-around;
                align-items: center;
                z-index: 100;
            }
            
            .mobile-nav button {
                flex: 1;
                text-align: center;
                padding: 0.5rem;
                border-radius: 0.5rem;
                background-color: rgba(59, 130, 246, 0.2);
                color: white;
                font-size: 0.75rem;
                margin: 0 0.25rem;
            }
            
            .mobile-nav button:hover {
                background-color: rgba(59, 130, 246, 0.3);
            }
        }
    </style>
</head>
<body class="min-h-screen text-white">

    <!-- 手机版本底部导航 -->
    <div class="mobile-nav md:hidden">
        <button id="mobileShareButton"><i class="fa fa-share-alt mr-1"></i> 分享</button>
        <button id="mobileThemeButton"><i class="fa fa-adjust mr-1"></i> 切换</button>
        <a href="./index.html" class="flex-1 text-center py-2 px-3 rounded-md bg-blue-500/20 text-white text-xs mx-1"><i class="fa fa-home mr-1"></i> 首页</a>
    </div>

    <div id="expiredOverlay" class="fixed inset-0 hidden items-center justify-center bg-black z-50">
        <div class="text-center px-6 relative z-10">
            <div class="text-4xl md:text-6xl font-bold tracking-widest bg-gradient-to-r from-rose-400 via-amber-300 to-cyan-400 text-transparent bg-clip-text">已过期</div>
            <div class="mt-3 text-sm md:text-base bg-gradient-to-r from-emerald-300 via-sky-300 to-violet-400 text-transparent bg-clip-text">分享链接已失效</div>
        </div>
    </div>

    <div id="pausedOverlay" class="fixed inset-0 hidden items-center justify-center bg-slate-950 z-50">
        <div class="text-center px-6 relative z-10">
            <div class="text-4xl md:text-6xl font-bold tracking-widest bg-gradient-to-r from-slate-300 via-blue-200 to-emerald-200 text-transparent bg-clip-text">已暂停</div>
            <div class="mt-3 text-sm md:text-base text-slate-200">该视频已被暂停分享</div>
        </div>
    </div>

    <div id="loadingOverlay" class="fixed inset-0 hidden items-center justify-center bg-black z-40">
        <div class="flex flex-col items-center space-y-3 text-white">
            <div class="w-12 h-12 border-4 border-blue-400 border-t-transparent rounded-full animate-spin"></div>
            <div class="text-sm text-white/80">加载中...</div>
        </div>
    </div>

    <script>
        function showLoading() {
            const overlay = document.getElementById('loadingOverlay');
            if (!overlay) return;
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
        }

        function hideLoading() {
            const overlay = document.getElementById('loadingOverlay');
            if (!overlay) return;
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
        }

        function safeDecodeBase64(value) {
            try {
                return atob(value);
            } catch (e) {
                return '';
            }
        }

        function base64Url(value) {
            try {
                return btoa(unescape(encodeURIComponent(String(value || ''))))
                    .replace(/\+/g, '-')
                    .replace(/\//g, '_')
                    .replace(/=+$/g, '');
            } catch (e) {
                return '';
            }
        }

        function parsePlayUrls(rawUrl) {
            const text = String(rawUrl || '');
            if (!text) return [];
            const segments = text.split('$$$').map(part => part.trim()).filter(Boolean);
            const preferredSegment = segments.find(seg => seg.toLowerCase().includes('m3u8')) || segments[0] || '';
            const parts = preferredSegment.split('#').map(part => part.trim()).filter(Boolean);
            return parts.map((part, index) => {
                const splitIndex = part.indexOf('$');
                if (splitIndex === -1) {
                    return { name: `第${index + 1}集`, url: part };
                }
                const name = part.slice(0, splitIndex).trim() || `第${index + 1}集`;
                const url = part.slice(splitIndex + 1).trim();
                return { name, url };
            }).filter(item => item.url);
        }

        function isM3u8Url(url) {
            if (!url) return false;
            const cleaned = String(url).split('?')[0].split('#')[0].toLowerCase();
            return cleaned.endsWith('.m3u8');
        }

        function getShareId(url, title) {
            const raw = `${url || ''}|${title || ''}`;
            const encoded = base64Url(raw);
            return encoded ? `s_${encoded}` : '';
        }

        function getShareIdFromQuery() {
            const params = new URLSearchParams(window.location.search);
            return String(params.get('sid') || '').trim();
        }

        function showError(message) {
            const box = document.getElementById('errorBox');
            if (!box) return;
            box.textContent = message;
            box.classList.remove('hidden');
        }

        function showExpiredOverlay() {
            const overlay = document.getElementById('expiredOverlay');
            if (!overlay) return;
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
        }

        function showPausedOverlay(message) {
            const overlay = document.getElementById('pausedOverlay');
            if (!overlay) return;
            const titleEl = overlay.querySelector('.text-4xl');
            if (titleEl) {
                titleEl.textContent = message || '已暂停';
            }
            const messageEl = overlay.querySelector('.mt-3');
            if (messageEl) {
                messageEl.textContent = message || '该视频已被暂停分享';
            }
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
        }

        function formatRemaining(ms) {
            if (ms <= 0) return '00:00';
            const total = Math.floor(ms / 1000);
            const days = Math.floor(total / 86400);
            const hours = Math.floor((total % 86400) / 3600);
            const minutes = Math.floor((total % 3600) / 60);
            const seconds = total % 60;
            if (days > 0) {
                return `${days}天 ${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function startCountdown(expiresAt) {
            const countdownEl = document.getElementById('shareCountdown');
            if (!countdownEl) return null;
            const setCountdownState = (state) => {
                countdownEl.classList.remove('is-permanent', 'is-live', 'is-expired');
                if (state) countdownEl.classList.add(state);
            };
            if (!expiresAt) {
                countdownEl.textContent = '有效期：永久';
                setCountdownState('is-permanent');
                return null;
            }
            let timer = null;
            const tick = () => {
                const remaining = expiresAt - Date.now();
                if (remaining <= 0) {
                    countdownEl.textContent = '有效期：已过期';
                    setCountdownState('is-expired');
                    showError('分享链接已过期');
                    showExpiredOverlay();
                    return false;
                }
                countdownEl.textContent = `有效期：${formatRemaining(remaining)}`;
                setCountdownState('is-live');
                return true;
            };
            tick();
            timer = setInterval(() => {
                if (!tick()) {
                    clearInterval(timer);
                }
            }, 1000);
            return timer;
        }

        async function fetchShareDetail(shareId) {
            if (!shareId) return null;
            try {
                const res = await fetch(`/api/share/${encodeURIComponent(shareId)}`, { cache: 'no-store' });
                const data = await res.json();
                if (!res.ok) {
                    if (res.status === 410 && data && data.message) {
                        return { __error: 'paused', message: data.message };
                    }
                    return null;
                }
                if (!data || data.code !== 200 || !data.data) return null;
                return data.data;
            } catch (e) {
                return null;
            }
        }

        let shareToastTimer = null;

        function showShareToast(message) {
            let toast = document.getElementById('spToast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'spToast';
                toast.className = 'sp-toast';
                document.body.appendChild(toast);
            }
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(shareToastTimer);
            shareToastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        function copyToClipboard(text) {
            try {
                navigator.clipboard.writeText(text).then(() => {
                    showShareToast('分享链接已复制到剪贴板');
                }).catch(() => {
                    prompt('请复制分享链接:', text);
                });
            } catch (e) {
                prompt('请复制分享链接:', text);
            }
        }

        // 分享当前页面（分享链接本身就是当前地址）
        function shareCurrentPage() {
            const url = window.location.href;
            const title = (currentSharePayload && currentSharePayload.title) || document.title || '分享视频';
            if (navigator.share) {
                navigator.share({
                    title,
                    text: '分享一个精彩视频',
                    url
                }).catch(() => copyToClipboard(url));
                return;
            }
            copyToClipboard(url);
        }

        function bindShareButton() {
            const shareButton = document.getElementById('shareButton');
            const mobileShareButton = document.getElementById('mobileShareButton');
            
            const handleShare = () => {
                shareCurrentPage();
            };
            
            if (shareButton) {
                shareButton.addEventListener('click', handleShare);
            }
            
            if (mobileShareButton) {
                mobileShareButton.addEventListener('click', handleShare);
            }
        }

        function bindThemeToggle() {
            const btn = document.getElementById('themeToggle');
            const mobileThemeButton = document.getElementById('mobileThemeButton');
            
            const handleThemeToggle = () => {
                document.body.classList.toggle('light-mode');
                const isLight = document.body.classList.contains('light-mode');
                localStorage.setItem('playTheme', isLight ? 'light' : 'dark');
            };
            
            const saved = localStorage.getItem('playTheme') || 'light';
            if (saved === 'light') {
                document.body.classList.add('light-mode');
            }
            
            if (btn) {
                btn.addEventListener('click', handleThemeToggle);
            }
            
            if (mobileThemeButton) {
                mobileThemeButton.addEventListener('click', handleThemeToggle);
            }
        }

        async function loadImageWithCache(url, fallbackUrl) {
            if (!url) return fallbackUrl;
            const cacheKey = `img_cache_${btoa(url)}`;
            try {
                const cachedData = localStorage.getItem(cacheKey);
                if (cachedData) {
                    return cachedData;
                }
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok');
                const blob = await response.blob();
                const reader = new FileReader();
                return new Promise((resolve) => {
                    reader.onloadend = () => {
                        const base64data = reader.result;
                        localStorage.setItem(cacheKey, base64data);
                        resolve(base64data);
                    };
                    reader.readAsDataURL(blob);
                });
            } catch (error) {
                console.error('Error loading image:', error);
                return fallbackUrl;
            }
        }

        // ===== 播放器与复制当前视频真实地址 =====
        let spPlayer = null;
        let currentSharePayload = null;
        let shareEpisodes = [];
        let shareActiveIndex = 0;

        function bindPlayerActions() {
            const copyBtn = document.getElementById('copyVideoButton');
            if (copyBtn) copyBtn.addEventListener('click', () => copyCurrentVideoInfo());
        }

        async function copyCurrentVideoInfo() {
            if (!currentSharePayload) {
                showShareToast('暂无可复制的视频地址');
                return;
            }
            const episode = shareEpisodes[shareActiveIndex] || null;
            const info = {
                title: episode
                    ? `${currentSharePayload.title || '视频'} ${episode.name || ''}`.trim()
                    : (currentSharePayload.title || '视频播放'),
                url: (episode && episode.url) || currentSharePayload.url || ''
            };
            const text = JSON.stringify(info, null, 2);
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.setAttribute('readonly', '');
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    document.body.appendChild(textarea);
                    textarea.select();
                    const copied = document.execCommand('copy');
                    document.body.removeChild(textarea);
                    if (!copied) throw new Error('copy failed');
                }
                showShareToast('标题和真实播放地址已复制');
            } catch (error) {
                prompt('请复制视频信息 JSON:', text);
            }
        }

        function initPlayer(payload) {
            currentSharePayload = payload || {};
            const titleEl = document.getElementById('playerTitle');
            const sourceEl = document.getElementById('shareSource');
            const shareTitleEl = document.getElementById('shareTitle');
            const shareDescEl = document.getElementById('shareDescription');
            const shareClassEl = document.getElementById('shareClass');
            const shareYearEl = document.getElementById('shareYear');
            const shareActorEl = document.getElementById('shareActor');
            const shareRemarksEl = document.getElementById('shareRemarks');
            const posterEl = document.getElementById('sharePoster');
            const episodePanel = document.getElementById('spEpisodePanel');
            const episodeCountEl = document.getElementById('spEpisodeCount');
            const episodeList = document.getElementById('spEpisodeList');

            const episodes = parsePlayUrls(payload.url);
            shareEpisodes = episodes;
            const hasEpisodeList = episodes.length > 1;

            // 起始集：优先按分享时的集名匹配，其次用索引
            let startIndex = 0;
            if (hasEpisodeList) {
                const sharedName = String(payload.episodeName || '').trim();
                if (sharedName) {
                    const found = episodes.findIndex(ep => String(ep.name || '').trim() === sharedName);
                    if (found >= 0) startIndex = found;
                } else {
                    const sharedIndex = Number(payload.episodeIndex);
                    if (Number.isFinite(sharedIndex) && sharedIndex >= 0 && sharedIndex < episodes.length) {
                        startIndex = sharedIndex;
                    }
                }
            }
            shareActiveIndex = startIndex;
            const initialEpisode = episodes[startIndex];
            const initialUrl = initialEpisode ? initialEpisode.url : payload.url;
            const initialTitle = hasEpisodeList && initialEpisode && initialEpisode.name
                ? `${payload.title} ${initialEpisode.name}`
                : payload.title;
            if (!isM3u8Url(initialUrl)) {
                showError('仅支持 .m3u8 视频地址');
                return;
            }

            if (titleEl) titleEl.textContent = initialTitle;
            if (sourceEl) {
                sourceEl.textContent = '';
                const labelSpan = document.createElement('span');
                labelSpan.className = 'sp-label';
                labelSpan.textContent = '来源：';
                const valueSpan = document.createElement('span');
                valueSpan.className = 'sp-source-value';
                valueSpan.textContent = payload.source || '未知来源';
                sourceEl.append(labelSpan, valueSpan);
            }
            if (shareTitleEl) shareTitleEl.textContent = payload.title || '未知标题';
            if (shareDescEl) shareDescEl.textContent = payload.desc || payload.description || '暂无介绍';
            if (shareClassEl) shareClassEl.textContent = payload.class || '未知';
            if (shareYearEl) shareYearEl.textContent = payload.year || '未知';
            if (shareActorEl) shareActorEl.textContent = payload.actor || '未知';
            if (shareRemarksEl) shareRemarksEl.textContent = payload.remarks || '未知';
            if (posterEl) {
                posterEl.src = payload.pic || '../loading.gif';
                posterEl.onerror = () => {
                    posterEl.src = '../loading.gif';
                };
            }

            const updatePlayerEpisodeNav = () => {
                if (!spPlayer || typeof spPlayer.setEpisodeNavigation !== 'function') return;
                spPlayer.setEpisodeNavigation(
                    hasEpisodeList && shareActiveIndex > 0,
                    hasEpisodeList && shareActiveIndex < episodes.length - 1
                );
            };

            // 与主站一致的自定义播放器
            spPlayer = new CustomVideoPlayer({
                container: document.getElementById('dplayer'),
                video: {
                    url: initialUrl,
                    type: 'hls',
                    pic: payload.pic || '',
                    title: initialTitle
                },
                autoplay: true,
                theme: '#3b82f6',
                loop: false,
                screenshot: true,
                hotkey: true,
                preload: 'auto',
                onPrevEpisode: () => handleEpisodeClick(shareActiveIndex - 1),
                onNextEpisode: () => handleEpisodeClick(shareActiveIndex + 1)
            });

            spPlayer.on('error', () => {
                showError('视频加载失败，请检查链接是否有效');
            });

            updatePlayerEpisodeNav();

            const renderEpisodes = () => {
                if (!episodeList) return;
                episodeList.innerHTML = episodes.map((ep, idx) => `
                    <button
                        type="button"
                        class="sp-chip${idx === shareActiveIndex ? ' active' : ''}"
                        data-episode-index="${idx}"
                        title="${ep.name || `第${idx + 1}集`}"
                    >${ep.name || `第${idx + 1}集`}</button>
                `).join('');
                if (episodeCountEl) episodeCountEl.textContent = `共 ${episodes.length} 集`;
                // 当前集不在可视区域时，把列表滚动到中间位置
                const active = episodeList.querySelector('.sp-chip.active');
                if (active) {
                    const listRect = episodeList.getBoundingClientRect();
                    const chipRect = active.getBoundingClientRect();
                    const visible = chipRect.top >= listRect.top && chipRect.bottom <= listRect.bottom;
                    if (!visible) {
                        episodeList.scrollTop += chipRect.top - listRect.top - (episodeList.clientHeight - chipRect.height) / 2;
                    }
                }
            };

            const handleEpisodeClick = (idx) => {
                if (!Number.isFinite(idx) || !episodes[idx]) return;
                const ep = episodes[idx];
                if (!isM3u8Url(ep.url)) {
                    showError('仅支持 .m3u8 视频地址');
                    return;
                }
                shareActiveIndex = idx;
                const nextTitle = `${payload.title} ${ep.name || `第${idx + 1}集`}`;
                if (titleEl) titleEl.textContent = nextTitle;
                if (spPlayer && typeof spPlayer.switchVideo === 'function') {
                    spPlayer.switchVideo({ url: ep.url, type: 'hls', pic: payload.pic || '', title: nextTitle });
                    spPlayer.play();
                }
                renderEpisodes();
                updatePlayerEpisodeNav();
            };

            if (hasEpisodeList) {
                if (episodePanel) episodePanel.classList.remove('hidden');
                renderEpisodes();
                if (episodeList) {
                    episodeList.addEventListener('click', (e) => {
                        const target = e.target;
                        if (!(target instanceof HTMLElement)) return;
                        const btn = target.closest('[data-episode-index]');
                        if (!btn) return;
                        handleEpisodeClick(Number(btn.getAttribute('data-episode-index')));
                    });
                }
            } else {
                if (episodePanel) episodePanel.classList.add('hidden');
            }
        }

        (async () => {
            showLoading();
            const sid = getShareIdFromQuery();
            if (sid) {
                const remote = await fetchShareDetail(sid);
                if (!remote) {
                    showError('分享已取消或不存在');
                    showExpiredOverlay();
                    hideLoading();
                    return;
                }
                if (remote.__error === 'paused') {
                    showError(remote.message || '该视频已被暂停分享');
                    showPausedOverlay(remote.message);
                    hideLoading();
                    return;
                }
                if (remote.expiresAt && Date.now() > remote.expiresAt) {
                    showError('分享链接已过期');
                    showExpiredOverlay();
                    startCountdown(remote.expiresAt);
                    hideLoading();
                    return;
                }
                await initPlayer(remote);
                startCountdown(remote.expiresAt);
                hideLoading();
                return;
            }
            showError('分享链接无效');
            showExpiredOverlay();
            hideLoading();
        })();

        bindShareButton();
        bindThemeToggle();
        bindPlayerActions();
    </script>
  </body>
</html>
