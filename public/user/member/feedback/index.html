<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户建议</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <style>
    html {
      scrollbar-gutter: stable;
    }
    body {
      overflow-y: scroll;
    }
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 12px 24px;
      border-radius: 12px;
      color: white;
      font-size: 14px;
      z-index: 1000;
      animation: fadeIn 0.3s ease-out;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }
    .toast-success {
      background: linear-gradient(135deg, #10b981, #059669);
    }
    .toast-error {
      background: linear-gradient(135deg, #ef4444, #dc2626);
    }
    .toast-info {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.8);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }
    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
    }
    @keyframes skeleton-loading {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }
    .scrollbar-thin::-webkit-scrollbar {
      width: 6px;
    }
    .scrollbar-thin::-webkit-scrollbar-track {
      background: transparent;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 3px;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb:hover {
      background: #9ca3af;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50 min-h-screen">
  <!-- 背景装饰 -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-80 h-80 bg-blue-100 rounded-full mix-blend-multiply filter blur-xl opacity-50 animate-pulse"></div>
    <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-purple-100 rounded-full mix-blend-multiply filter blur-xl opacity-50 animate-pulse" style="animation-delay: 1s;"></div>
  </div>

  <div class="relative max-w-2xl mx-auto px-4 py-8">
    <!-- 头部卡片 -->
    <div class="bg-white/80 backdrop-blur-sm rounded-2xl shadow-lg shadow-slate-200/50 p-6 mb-6">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/20">
            <i class="fa fa-comments text-white"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold text-slate-800">用户建议</h1>
            <div class="text-sm text-slate-500 mt-0.5">
              <span id="loginStatus">校验登录中...</span>
              <button id="loginBtn" class="ml-2 text-blue-600 hover:text-blue-700 font-medium hidden">去登录</button>
            </div>
          </div>
        </div>
        <div class="w-12 h-12 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-xl flex items-center justify-center shadow-lg shadow-emerald-500/20">
          <i class="fa fa-lightbulb-o text-white"></i>
        </div>
      </div>
    </div>

    <!-- 历史反馈列表 -->
    <div class="bg-white/80 backdrop-blur-sm rounded-2xl shadow-lg shadow-slate-200/50 p-6 mb-6">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
          <i class="fa fa-history text-slate-400"></i>
          <span id="serverMeta" class="text-sm text-slate-500">历史反馈：未加载</span>
        </div>
        <button id="refreshServerBtn" class="flex items-center gap-1 px-3 py-1.5 text-sm text-blue-600 hover:text-blue-700 bg-blue-50 hover:bg-blue-100 rounded-lg transition-colors hidden">
          <i class="fa fa-refresh"></i>
          <span>刷新</span>
        </button>
      </div>
      <div id="chatList" class="space-y-4 max-h-[50vh] overflow-y-auto pr-2 scrollbar-thin"></div>
    </div>

    <!-- 提交表单 -->
    <div class="bg-white/80 backdrop-blur-sm rounded-2xl shadow-lg shadow-slate-200/50 p-6">
      <div class="flex items-center gap-2 mb-4">
        <div class="w-1 h-4 bg-gradient-to-b from-blue-500 to-purple-600 rounded-full"></div>
        <h2 class="font-semibold text-slate-800">提交反馈</h2>
      </div>
      
      <div class="space-y-4">
        <!-- 称呼和类型 -->
        <div class="flex flex-col sm:flex-row gap-3">
          <div class="flex-1 relative">
            <label class="block text-xs text-slate-500 mb-1.5">你的称呼</label>
            <div class="relative">
              <i class="fa fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
              <input id="nicknameInput" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all" placeholder="你的称呼" readonly>
            </div>
          </div>
          <div class="w-40">
            <label class="block text-xs text-slate-500 mb-1.5">反馈类型</label>
            <select id="typeSelect" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all appearance-none cursor-pointer">
              <option value="建议">💡 建议</option>
              <option value="问题">⚠️ 问题</option>
              <option value="反馈">📝 反馈</option>
            </select>
          </div>
        </div>

        <!-- 邮箱 -->
        <div>
          <label class="block text-xs text-slate-500 mb-1.5">电子邮箱（可选）</label>
          <div class="relative">
            <i class="fa fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input id="emailInput" type="email" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all" placeholder="your@email.com">
          </div>
        </div>

        <!-- 反馈内容 -->
        <div>
          <label class="block text-xs text-slate-500 mb-1.5">反馈内容</label>
          <div class="relative">
            <i class="fa fa-message-square absolute left-3 top-3 text-slate-400"></i>
            <textarea id="messageInput" rows="4" maxlength="100" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all resize-none" placeholder="请输入你的建议或问题..."></textarea>
            <span id="charCount" class="absolute right-3 bottom-3 text-xs text-slate-400">0/100</span>
          </div>
        </div>

        <!-- 验证码 -->
        <div class="flex items-center gap-3">
          <div class="flex-1 relative">
            <label class="block text-xs text-slate-500 mb-1.5">验证码</label>
            <div class="relative">
              <i class="fa fa-shield absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
              <input id="captchaInput" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all" placeholder="请输入验证码">
            </div>
          </div>
          <div class="w-32">
            <label class="block text-xs text-slate-500 mb-1.5">&nbsp;</label>
            <img id="captchaImage" class="w-full h-12 cursor-pointer border border-slate-200 rounded-xl hover:border-blue-300 transition-colors" src="" alt="验证码" title="点击刷新">
          </div>
        </div>

        <!-- 提交按钮 -->
        <div class="flex items-center justify-between pt-2">
          <span class="text-xs text-slate-500 flex items-center gap-1">
            <i class="fa fa-lock text-slate-400"></i>
            提交后会保存到后端，我们会尽快处理
          </span>
          <button id="sendBtn" class="px-6 py-3 bg-gradient-to-r from-blue-500 to-purple-600 text-white font-medium rounded-xl hover:from-blue-600 hover:to-purple-700 transition-all shadow-lg shadow-blue-500/25 hover:shadow-blue-500/40 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:shadow-none flex items-center gap-2">
            <i class="fa fa-paper-plane"></i>
            <span>发送反馈</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 底部信息 -->
    <div class="text-center mt-6 text-xs text-slate-400">
      <p>感谢你的反馈，我们会认真对待每一条建议</p>
    </div>
  </div>

  <script>
    const TOKEN_KEY = "userToken";

    const chatList = document.getElementById("chatList");
    const messageInput = document.getElementById("messageInput");
    const nicknameInput = document.getElementById("nicknameInput");
    const emailInput = document.getElementById("emailInput");
    const typeSelect = document.getElementById("typeSelect");
    const sendBtn = document.getElementById("sendBtn");

    const loginStatus = document.getElementById("loginStatus");
    const loginBtn = document.getElementById("loginBtn");
    const serverMeta = document.getElementById("serverMeta");
    const refreshServerBtn = document.getElementById("refreshServerBtn");
    const captchaInput = document.getElementById("captchaInput");
    const captchaImage = document.getElementById("captchaImage");
    let currentRole = "";

    const getToken = () => localStorage.getItem(TOKEN_KEY) || "";
    const authHeaders = () => {
      const token = getToken();
      return token ? { Authorization: "Bearer " + token } : {};
    };
    const redirectToLogin = () => {
      const redirect = encodeURIComponent("/user/member/feedback/");
      window.location.href = `/login/index.html?redirect=${redirect}`;
    };

    const refreshLoginStatus = async () => {
      const token = getToken();
      if (!token) {
        loginStatus.textContent = "未登录，登录后可提交";
        loginBtn.classList.remove("hidden");
        refreshServerBtn.classList.add("hidden");
        sendBtn.disabled = true;
        sendBtn.classList.add("opacity-50");
        return;
      }
      try {
        const res = await fetch("/api/user/profile", { headers: authHeaders() });
        const data = await res.json();
        if (data.code === 200) {
          loginStatus.textContent = "已登录";
          loginBtn.classList.add("hidden");
          refreshServerBtn.classList.remove("hidden");
          sendBtn.disabled = false;
          sendBtn.classList.remove("opacity-50");
          currentRole = String(data.data?.role || "");
          const nickname = data.data?.nickname || data.data?.username || "用户";
          nicknameInput.value = nickname;
          await loadSelfFeedback();
          return;
        }
      } catch (e) {
        // ignore
      }
      loginStatus.textContent = "登录失效，请重新登录";
      loginBtn.classList.remove("hidden");
      refreshServerBtn.classList.add("hidden");
      sendBtn.disabled = true;
      sendBtn.classList.add("opacity-50");
    };

    const showSkeleton = () => {
      chatList.innerHTML = `
        <div class="space-y-4">
          ${Array(3).fill('').map(() => `
            <div class="bg-slate-50 rounded-xl p-4 border border-slate-100">
              <div class="flex items-center gap-3 mb-3">
                <div class="w-8 h-8 skeleton rounded-full"></div>
                <div>
                  <div class="h-4 skeleton rounded w-20 mb-1"></div>
                  <div class="h-3 skeleton rounded w-32"></div>
                </div>
              </div>
              <div class="h-3 skeleton rounded w-full mb-2"></div>
              <div class="h-3 skeleton rounded w-3/4"></div>
            </div>
          `).join('')}
        </div>
      `;
    };

    const renderServerMessages = (list) => {
      if (!Array.isArray(list) || list.length === 0) {
        serverMeta.textContent = "历史反馈：暂无";
        chatList.innerHTML = `
          <div class="text-center py-12">
            <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <i class="fa fa-inbox text-slate-400 text-2xl"></i>
            </div>
            <p class="text-slate-500">暂无反馈记录</p>
            <p class="text-sm text-slate-400 mt-1">提交你的第一条反馈吧</p>
          </div>
        `;
        return;
      }
      serverMeta.textContent = `历史反馈：共 ${list.length} 条`;
      chatList.innerHTML = list.map((item) => {
        const nickname = item.userNickname || item.nickname || "用户";
        const title = item.type ? `${nickname} · ${item.type}` : nickname;
        const emailText = item.email ? ` · ${item.email}` : '';
        const replies = Array.isArray(item.replies) ? item.replies : [];
        const hasAdminReply = replies.some((reply) => reply && reply.role === "admin");
        const canReply = currentRole === "admin" || hasAdminReply;
        const repliesHtml = replies.length
          ? `
            <div class="mt-3 space-y-2 pt-3 border-t border-slate-100">
              <div class="flex items-center gap-1 text-xs text-slate-500">
                <i class="fa fa-reply"></i>
                <span>回复</span>
              </div>
              ${replies.map((reply) => {
              const roleLabel = reply.role === "admin" ? "管理员" : "你";
              const roleClass = reply.role === "admin" ? "bg-gradient-to-r from-emerald-50 to-teal-50 border-emerald-200" : "bg-white border-slate-200";
              return `
                <div class="rounded-xl border px-4 py-3 ${roleClass}">
                  <div class="flex items-center justify-between text-xs text-slate-500 mb-1">
                    <span>${roleLabel}</span>
                    <span>${new Date(reply.createdAt).toLocaleString()}</span>
                  </div>
                  <div class="text-sm text-slate-700 whitespace-pre-wrap">${reply.message || ""}</div>
                </div>
              `;
            }).join("")}
            </div>
            `
          : "";
        const typeConfig = {
          '建议': { color: 'emerald', bg: 'bg-emerald-50', border: 'border-emerald-200', label: '💡' },
          '问题': { color: 'red', bg: 'bg-red-50', border: 'border-red-200', label: '⚠️' },
          '反馈': { color: 'blue', bg: 'bg-blue-50', border: 'border-blue-200', label: '📝' }
        };
        const config = typeConfig[item.type] || { color: 'slate', bg: 'bg-slate-50', border: 'border-slate-200', label: '📄' };
        
        return `
          <div class="${config.bg} ${config.border} border rounded-xl p-4" data-feedback-id="${item.id || ""}">
            <div class="flex items-center justify-between mb-2">
              <div class="flex items-center gap-2">
                <span>${config.label}</span>
                <span class="text-xs text-slate-500">${title}${emailText}</span>
              </div>
              <span class="text-xs text-slate-400">${new Date(item.createdAt).toLocaleString()}</span>
            </div>
            <div class="text-sm text-slate-700 whitespace-pre-wrap">${item.message || ""}</div>
            ${repliesHtml}
            ${canReply ? `
              <div class="mt-3 flex items-center gap-2">
                <input class="reply-input flex-1 px-4 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all" placeholder="回复这条反馈">
                <button class="reply-btn px-4 py-2 bg-gradient-to-r from-blue-500 to-purple-600 text-white text-sm font-medium rounded-xl hover:from-blue-600 hover:to-purple-700 transition-all">
                  回复
                </button>
              </div>
            ` : ""}
          </div>
        `;
      }).join("");
      chatList.scrollTop = 0;
    };

    const loadSelfFeedback = async () => {
      const token = getToken();
      if (!token) {
        serverMeta.textContent = "历史反馈：未登录";
        chatList.innerHTML = `
          <div class="text-center py-12">
            <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <i class="fa fa-user-circle text-slate-400 text-2xl"></i>
            </div>
            <p class="text-slate-500">请登录后查看历史反馈</p>
            <button onclick="redirectToLogin()" class="mt-3 px-4 py-2 text-blue-600 hover:text-blue-700 bg-blue-50 hover:bg-blue-100 rounded-lg text-sm transition-colors">
              去登录
            </button>
          </div>
        `;
        return;
      }
      try {
        serverMeta.textContent = "历史反馈：加载中...";
        showSkeleton();
        const res = await fetch("/api/user/feedbacks/self?page=1&pageSize=50", { headers: authHeaders() });
        const data = await res.json();
        if (data.code !== 200) {
          serverMeta.textContent = data.message || "历史反馈：加载失败";
          chatList.innerHTML = `
            <div class="text-center py-12">
              <div class="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa fa-exclamation-circle text-red-400 text-2xl"></i>
              </div>
              <p class="text-slate-500">加载失败，请稍后重试</p>
            </div>
          `;
          return;
        }
        const list = Array.isArray(data.data) ? data.data : [];
        renderServerMessages(list);
      } catch (e) {
        serverMeta.textContent = "历史反馈：加载失败";
        chatList.innerHTML = `
          <div class="text-center py-12">
            <div class="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-4">
              <i class="fa fa-exclamation-circle text-red-400 text-2xl"></i>
            </div>
            <p class="text-slate-500">加载失败，请稍后重试</p>
          </div>
        `;
      }
    };

    const showToast = (message, type = 'info') => {
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'fadeIn 0.3s ease-out reverse';
        setTimeout(() => {
          document.body.removeChild(toast);
        }, 300);
      }, 2500);
    };

    const loadCaptcha = () => {
      captchaImage.src = `/api/user/captcha?${Date.now()}`;
    };

    const setBtnLoading = (btn, loading, label) => {
      if (!btn) return;
      if (loading) {
        btn.disabled = true;
        btn.classList.add("opacity-70");
        btn.innerHTML = `
          <span class="inline-flex items-center gap-2">
            <span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
            <span>${label || "处理中..."}</span>
          </span>
        `;
      } else {
        btn.disabled = false;
        btn.classList.remove("opacity-70");
        btn.innerHTML = `<i class="fa fa-paper-plane"></i><span>${label || "发送反馈"}</span>`;
      }
    };

    sendBtn.addEventListener("click", async () => {
      const message = (messageInput.value || "").trim();
      if (!message) {
        showToast("请输入反馈内容", "error");
        return;
      }
      const captcha = (captchaInput.value || "").trim();
      if (!captcha) {
        showToast("请输入验证码", "error");
        return;
      }
      const token = getToken();
      if (!token) {
        redirectToLogin();
        return;
      }
      setBtnLoading(sendBtn, true, "发送中...");
      try {
        const verifyRes = await fetch("/api/user/verify-captcha", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ captcha })
        });
        const verifyData = await verifyRes.json();
        if (verifyData.code !== 200) {
          showToast(verifyData.message || "验证码错误", "error");
          loadCaptcha();
          return;
        }
        const payload = {
          type: typeSelect.value || "建议",
          message,
          email: (emailInput.value || "").trim(),
          page: window.location.pathname
        };
        const res = await fetch("/api/user/feedbacks", {
          method: "POST",
          headers: { "Content-Type": "application/json", ...authHeaders() },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.code !== 200) {
          showToast(data.message || "提交失败", "error");
          return;
        }
        messageInput.value = "";
        captchaInput.value = "";
        loadCaptcha();
        showToast("反馈已发送，感谢你的建议！", "success");
        await loadSelfFeedback();
      } catch (e) {
        showToast("提交失败", "error");
      } finally {
        setBtnLoading(sendBtn, false, "发送反馈");
      }
    });

    loginBtn.addEventListener("click", () => {
      redirectToLogin();
    });
    refreshServerBtn.addEventListener("click", async () => {
      refreshServerBtn.innerHTML = '<i class="fa fa-refresh animate-spin"></i><span>加载中...</span>';
      try {
        await loadSelfFeedback();
      } finally {
        refreshServerBtn.innerHTML = '<i class="fa fa-refresh"></i><span>刷新</span>';
      }
    });

    chatList.addEventListener("click", async (e) => {
      const target = e.target;
      if (!(target instanceof HTMLElement)) return;
      const replyBtn = target.closest(".reply-btn");
      if (!replyBtn) return;
      const card = replyBtn.closest("[data-feedback-id]");
      if (!card) return;
      const id = card.getAttribute("data-feedback-id");
      const input = card.querySelector(".reply-input");
      const message = input ? String(input.value || "").trim() : "";
      if (!id || !message) return;
      const token = getToken();
      if (!token) {
        redirectToLogin();
        return;
      }
      replyBtn.innerHTML = '<span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin inline-block"></span>';
      try {
        const res = await fetch(`/api/user/feedbacks/${id}/reply`, {
          method: "POST",
          headers: { "Content-Type": "application/json", ...authHeaders() },
          body: JSON.stringify({ message })
        });
        const data = await res.json();
        if (data.code !== 200) {
          showToast(data.message || "回复失败", "error");
          return;
        }
        if (input) input.value = "";
        showToast("回复已发送", "success");
        await loadSelfFeedback();
      } catch (e2) {
        showToast("回复失败", "error");
      } finally {
        replyBtn.innerHTML = "回复";
      }
    });

    captchaImage.addEventListener("click", loadCaptcha);

    // 字数统计
    const charCount = document.getElementById("charCount");
    messageInput.addEventListener("input", () => {
      const count = messageInput.value.length;
      charCount.textContent = `${count}/100`;
      if (count >= 100) {
        charCount.classList.add("text-red-500");
      } else {
        charCount.classList.remove("text-red-500");
      }
    });

    showSkeleton();
    refreshLoginStatus();
    loadCaptcha();
  </script>
</body>
