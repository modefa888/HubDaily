<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.css">
    <script src="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
      html {
        scrollbar-gutter: stable;
      }
      body {
        overflow-y: scroll;
      }
      body.drawer-open {
        overflow: hidden;
      }
      .toast {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        border-radius: 12px;
        color: white;
        font-size: 14px;
        z-index: 1000;
        animation: toastFadeIn 0.3s ease-out;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      }
      .toast-success {
        background: linear-gradient(135deg, #10b981, #059669);
      }
      .toast-error {
        background: linear-gradient(135deg, #ef4444, #dc2626);
      }
      .toast-info {
        background: linear-gradient(135deg, #3b82f6, #2563eb);
      }
      @keyframes toastFadeIn {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }
      .skeleton {
        background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: skeleton-loading 1.5s infinite;
      }
      @keyframes skeleton-loading {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
      .scrollbar-thin::-webkit-scrollbar {
        width: 6px;
      }
      .scrollbar-thin::-webkit-scrollbar-track {
        background: transparent;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 3px;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb:hover {
        background: #9ca3af;
      }
    </style>
  </head>
  <body class="bg-gradient-to-br from-slate-50 via-blue-50 to-purple-50 min-h-screen">
    <!-- 背景装饰 -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
      <div class="absolute -top-40 -right-40 w-80 h-80 bg-blue-200 rounded-full mix-blend-multiply filter blur-xl opacity-30 animate-pulse"></div>
      <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-purple-200 rounded-full mix-blend-multiply filter blur-xl opacity-30 animate-pulse" style="animation-delay: 1s;"></div>
    </div>

    <div class="min-h-screen flex flex-col relative">
      <!-- 顶部导航 -->
      <nav class="bg-white/80 backdrop-blur-lg border-b border-slate-200/50 shadow-sm fixed top-0 left-0 right-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <button id="mobileMenuBtn" class="md:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100 transition-colors">
              <i class="fa fa-bars"></i>
            </button>
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">
                <i class="fa fa-user text-white text-sm"></i>
              </div>
              <div class="text-lg font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">个人中心</div>
            </div>
          </div>
          <div class="flex items-center space-x-3">
            <a href="/index.html" class="text-sm text-blue-600 hover:text-blue-700 hover:underline flex items-center gap-1">
              <i class="fa fa-home"></i>
              <span>返回首页</span>
            </a>
            <button id="logoutBtn" class="px-4 py-2 rounded-lg bg-gradient-to-r from-slate-700 to-slate-800 text-white text-sm font-medium hover:from-slate-800 hover:to-slate-900 transition-all shadow-md hover:shadow-lg">
              <i class="fa fa-sign-out mr-1"></i>退出
            </button>
          </div>
        </div>
      </nav>

      <!-- 侧边栏遮罩 -->
      <div id="sideNavOverlay" class="fixed inset-0 bg-black/30 backdrop-blur-sm hidden z-30"></div>

      <!-- 主内容区 -->
      <div class="flex flex-1 pt-14">
        <!-- 侧边导航 -->
        <aside id="sideNav" class="w-52 bg-white/80 backdrop-blur-lg border-r border-slate-200/50 p-4 space-y-2 fixed top-14 bottom-0 left-0 overflow-y-auto transform -translate-x-full md:translate-x-0 transition-transform duration-200 z-40">
          <div class="text-xs text-slate-400 uppercase tracking-wider px-3 mb-2">菜单</div>
          <button class="module-tab w-full text-left px-4 py-3 rounded-xl text-sm font-medium bg-gradient-to-r from-blue-500 to-purple-600 text-white shadow-lg shadow-blue-500/25 transition-all" data-module-target="profile">
            <i class="fa fa-user-circle mr-2"></i>账号信息
          </button>
          <button class="module-tab w-full text-left px-4 py-3 rounded-xl text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 hover:shadow-md transition-all" data-module-target="favorites">
            <i class="fa fa-heart mr-2"></i>喜欢列表
          </button>
          <button class="module-tab w-full text-left px-4 py-3 rounded-xl text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 hover:shadow-md transition-all" data-module-target="articleFavorites">
            <i class="fa fa-bookmark mr-2"></i>文章收藏
          </button>
          <button class="module-tab w-full text-left px-4 py-3 rounded-xl text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 hover:shadow-md transition-all" data-module-target="shares">
            <i class="fa fa-share-alt mr-2"></i>分享列表
          </button>
        </aside>

        <!-- 主内容 -->
        <main class="flex-1 p-4 md:p-6 ml-0 md:ml-52">
          <div id="appContent" class="max-w-4xl mx-auto space-y-6">

            <!-- 账号信息模块 -->
            <section class="module-section bg-white/80 backdrop-blur-lg rounded-2xl shadow-xl shadow-slate-200/50 p-6 space-y-6" data-module="profile">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center">
                    <i class="fa fa-user text-white"></i>
                  </div>
                  <h2 class="text-xl font-bold text-slate-800">账号信息</h2>
                </div>
                <span id="profileStatus" class="text-xs px-3 py-1 rounded-full bg-slate-100 text-slate-500">加载中...</span>
              </div>
              
              <!-- 骨架屏 -->
              <div id="profileSkeleton" class="space-y-4">
                <div class="h-8 skeleton rounded-lg"></div>
                <div class="border-t border-slate-100 pt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <div class="h-4 skeleton rounded w-20 mb-2"></div>
                    <div class="h-10 skeleton rounded-xl"></div>
                  </div>
                  <div>
                    <div class="h-4 skeleton rounded w-24 mb-2"></div>
                    <div class="flex items-center gap-3">
                      <div class="w-14 h-14 skeleton rounded-full"></div>
                      <div class="flex-1 h-10 skeleton rounded-xl"></div>
                    </div>
                  </div>
                  <div class="md:col-span-2">
                    <div class="h-4 skeleton rounded w-24 mb-2"></div>
                    <div class="h-24 skeleton rounded-xl"></div>
                  </div>
                  <div class="md:col-span-2 h-4 skeleton rounded w-64"></div>
                </div>
                <div class="border-t border-slate-100 pt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <div class="h-4 skeleton rounded w-20 mb-2"></div>
                    <div class="h-10 skeleton rounded-xl"></div>
                  </div>
                  <div class="flex items-end">
                    <div class="h-10 skeleton rounded-xl w-32"></div>
                  </div>
                </div>
                <div class="border-t border-slate-100 pt-4">
                  <div class="h-5 skeleton rounded w-32 mb-4"></div>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="h-10 skeleton rounded-xl"></div>
                    <div class="h-10 skeleton rounded-xl"></div>
                    <div class="h-10 skeleton rounded-xl"></div>
                    <div class="flex items-end">
                      <div class="h-10 skeleton rounded-xl w-32"></div>
                    </div>
                  </div>
                </div>
              </div>
              
              <!-- 实际内容 -->
              <div id="profileContent" class="hidden space-y-6">
                <div id="profileSummary" class="text-sm text-slate-600 bg-gradient-to-r from-blue-50 to-purple-50 border border-blue-200/50 rounded-xl px-4 py-3"></div>

                <div class="border-t border-slate-100 pt-4 space-y-4">
                  <h3 class="font-semibold text-slate-800 flex items-center gap-2">
                    <i class="fa fa-user-edit text-blue-500"></i>基本信息
                  </h3>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                    <div>
                      <label class="block text-xs text-slate-500 mb-2">昵称</label>
                      <input id="editNickname" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all" placeholder="请输入昵称">
                    </div>
                    <div>
                      <label class="block text-xs text-slate-500 mb-2">头像链接</label>
                      <div class="flex items-center gap-3">
                        <img id="avatarPreview" src="/loading.gif" alt="avatar" class="w-14 h-14 rounded-full object-cover border-2 border-slate-200 bg-slate-100" onerror="this.src='https://via.placeholder.com/56'">
                        <input id="editAvatar" class="flex-1 px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all" placeholder="https://...">
                      </div>
                    </div>
                    <div class="md:col-span-2">
                      <label class="block text-xs text-slate-500 mb-2">个人备注</label>
                      <textarea id="editProfileNote" rows="3" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all resize-none" placeholder="填写个人备注"></textarea>
                    </div>
                    <div class="md:col-span-2 text-xs text-slate-500 bg-slate-50 rounded-lg px-3 py-2">
                      <i class="fa fa-info-circle mr-1"></i>账号/角色/创建时间等关键字段不可修改
                    </div>
                  </div>
                </div>

                <div class="border-t border-slate-100 pt-4 space-y-4">
                  <h3 class="font-semibold text-slate-800 flex items-center gap-2">
                    <i class="fa fa-lock text-blue-500"></i>修改密码
                  </h3>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                    <div>
                      <label class="block text-xs text-slate-500 mb-2">旧密码</label>
                      <input id="oldPassword" type="password" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all" placeholder="输入旧密码">
                    </div>
                    <div class="flex items-end">
                      <button id="verifyPasswordBtn" class="w-full px-4 py-3 rounded-xl bg-gradient-to-r from-blue-500 to-purple-600 text-white text-sm font-medium hover:from-blue-600 hover:to-purple-700 transition-all shadow-lg shadow-blue-500/25">
                        <i class="fa fa-check mr-1"></i>验证旧密码
                      </button>
                    </div>
                    <div id="newPasswordFields" class="md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
                      <div>
                        <label class="block text-xs text-slate-500 mb-2">新密码</label>
                        <input id="newPassword" type="password" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all" placeholder="输入新密码">
                      </div>
                      <div>
                        <label class="block text-xs text-slate-500 mb-2">确认新密码</label>
                        <input id="newPasswordConfirm" type="password" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all" placeholder="再次输入新密码">
                      </div>
                      <div class="md:col-span-2">
                        <button id="savePasswordBtn" class="w-full px-4 py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white text-sm font-medium hover:from-emerald-600 hover:to-teal-700 transition-all shadow-lg shadow-emerald-500/25">
                          <i class="fa fa-save mr-1"></i>修改密码
                        </button>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="border-t border-slate-100 pt-4 space-y-4">
                  <h3 class="font-semibold text-slate-800 flex items-center gap-2">
                    <i class="fa fa-question-circle text-blue-500"></i>安全问题设置
                  </h3>
                  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                    <div>
                      <label class="block text-xs text-slate-500 mb-2">安全问题</label>
                      <select id="editSecurityQuestion" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all appearance-none cursor-pointer">
                        <option value="">请选择安全问题</option>
                      </select>
                    </div>
                    <div>
                      <label class="block text-xs text-slate-500 mb-2">安全答案</label>
                      <input id="editSecurityAnswer" type="text" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all" placeholder="请输入安全答案">
                    </div>
                    <div>
                      <label class="block text-xs text-slate-500 mb-2">验证密码</label>
                      <input id="editSecurityQuestionPassword" type="password" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 transition-all" placeholder="输入密码以验证">
                    </div>
                  </div>
                  <div class="flex items-center gap-3">
                    <button id="saveSecurityQuestionBtn" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 text-white text-sm font-medium hover:from-indigo-600 hover:to-purple-700 transition-all shadow-lg shadow-indigo-500/25">
                      <i class="fa fa-shield mr-1"></i>保存安全问题
                    </button>
                    <span id="securityQuestionStatus" class="text-xs text-slate-500"></span>
                  </div>
                </div>
              </div>
            </section>

            <!-- 喜欢列表模块 -->
            <section class="module-section bg-white/80 backdrop-blur-lg rounded-2xl shadow-xl shadow-slate-200/50 p-6 space-y-4 hidden" data-module="favorites">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 bg-gradient-to-br from-pink-500 to-rose-600 rounded-xl flex items-center justify-center">
                    <i class="fa fa-heart text-white"></i>
                  </div>
                  <h2 class="text-xl font-bold text-slate-800">喜欢列表</h2>
                </div>
                <div class="flex items-center gap-3">
                  <span id="favoriteCount" class="text-xs px-3 py-1 rounded-full bg-pink-100 text-pink-600">0</span>
                  <button class="refresh-btn p-2 rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-700 transition-all" data-refresh-target="favorites" title="刷新">
                    <i class="fa fa-refresh"></i>
                  </button>
                </div>
              </div>
              
              <!-- 骨架屏 -->
              <div id="favoritesSkeleton" class="max-h-[60vh] overflow-y-auto pr-2 scrollbar-thin">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div class="favorite-card rounded-xl border border-slate-200 p-4 skeleton">
                    <div class="flex items-start gap-4">
                      <div class="w-20 h-24 skeleton rounded-lg"></div>
                      <div class="flex-1 space-y-3">
                        <div class="h-5 skeleton rounded"></div>
                        <div class="h-4 skeleton rounded w-3/4"></div>
                        <div class="h-4 skeleton rounded w-1/2"></div>
                      </div>
                    </div>
                  </div>
                  <div class="favorite-card rounded-xl border border-slate-200 p-4 skeleton">
                    <div class="flex items-start gap-4">
                      <div class="w-20 h-24 skeleton rounded-lg"></div>
                      <div class="flex-1 space-y-3">
                        <div class="h-5 skeleton rounded"></div>
                        <div class="h-4 skeleton rounded w-3/4"></div>
                        <div class="h-4 skeleton rounded w-1/2"></div>
                      </div>
                    </div>
                  </div>
                  <div class="favorite-card rounded-xl border border-slate-200 p-4 skeleton">
                    <div class="flex items-start gap-4">
                      <div class="w-20 h-24 skeleton rounded-lg"></div>
                      <div class="flex-1 space-y-3">
                        <div class="h-5 skeleton rounded"></div>
                        <div class="h-4 skeleton rounded w-3/4"></div>
                        <div class="h-4 skeleton rounded w-1/2"></div>
                      </div>
                    </div>
                  </div>
                  <div class="favorite-card rounded-xl border border-slate-200 p-4 skeleton">
                    <div class="flex items-start gap-4">
                      <div class="w-20 h-24 skeleton rounded-lg"></div>
                      <div class="flex-1 space-y-3">
                        <div class="h-5 skeleton rounded"></div>
                        <div class="h-4 skeleton rounded w-3/4"></div>
                        <div class="h-4 skeleton rounded w-1/2"></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              
              <!-- 实际内容 -->
              <div id="favoritesContent" class="max-h-[60vh] overflow-y-auto pr-2 scrollbar-thin hidden">
                <div id="favoriteList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
              </div>
            </section>

            <!-- 文章收藏模块 -->
            <section class="module-section bg-white/80 backdrop-blur-lg rounded-2xl shadow-xl shadow-slate-200/50 p-6 space-y-4 hidden" data-module="articleFavorites">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 bg-gradient-to-br from-amber-500 to-orange-600 rounded-xl flex items-center justify-center">
                    <i class="fa fa-bookmark text-white"></i>
                  </div>
                  <h2 class="text-xl font-bold text-slate-800">文章收藏</h2>
                </div>
                <div class="flex items-center gap-3">
                  <span id="articleFavoriteStatus" class="text-xs px-3 py-1 rounded-full bg-amber-100 text-amber-600">加载中...</span>
                  <button class="refresh-btn p-2 rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-700 transition-all" data-refresh-target="articleFavorites" title="刷新">
                    <i class="fa fa-refresh"></i>
                  </button>
                </div>
              </div>
              
              <!-- 骨架屏 -->
              <div id="articleFavoritesSkeleton" class="space-y-3">
                <div class="article-favorite-card rounded-xl border border-slate-200 p-5 skeleton">
                  <div class="flex justify-between items-start mb-3">
                    <div class="h-5 skeleton rounded w-1/2"></div>
                    <div class="flex gap-3">
                      <div class="h-5 skeleton rounded w-16"></div>
                      <div class="h-5 skeleton rounded w-20"></div>
                    </div>
                  </div>
                  <div class="h-4 skeleton rounded w-1/3 mb-2"></div>
                  <div class="h-4 skeleton rounded w-1/4 mb-2"></div>
                  <div class="h-4 skeleton rounded w-1/2"></div>
                </div>
                <div class="article-favorite-card rounded-xl border border-slate-200 p-5 skeleton">
                  <div class="flex justify-between items-start mb-3">
                    <div class="h-5 skeleton rounded w-1/2"></div>
                    <div class="flex gap-3">
                      <div class="h-5 skeleton rounded w-16"></div>
                      <div class="h-5 skeleton rounded w-20"></div>
                    </div>
                  </div>
                  <div class="h-4 skeleton rounded w-1/3 mb-2"></div>
                  <div class="h-4 skeleton rounded w-1/4 mb-2"></div>
                  <div class="h-4 skeleton rounded w-1/2"></div>
                </div>
                <div class="article-favorite-card rounded-xl border border-slate-200 p-5 skeleton">
                  <div class="flex justify-between items-start mb-3">
                    <div class="h-5 skeleton rounded w-1/2"></div>
                    <div class="flex gap-3">
                      <div class="h-5 skeleton rounded w-16"></div>
                      <div class="h-5 skeleton rounded w-20"></div>
                    </div>
                  </div>
                  <div class="h-4 skeleton rounded w-1/3 mb-2"></div>
                  <div class="h-4 skeleton rounded w-1/4 mb-2"></div>
                  <div class="h-4 skeleton rounded w-1/2"></div>
                </div>
              </div>
              
              <!-- 实际内容 -->
              <div id="articleFavoritesContent" class="space-y-3 hidden">
                <div id="articleFavoriteList" class="space-y-3"></div>
              </div>
            </section>

            <!-- 分享列表模块 -->
            <section class="module-section bg-white/80 backdrop-blur-lg rounded-2xl shadow-xl shadow-slate-200/50 p-6 space-y-4 hidden" data-module="shares">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-xl flex items-center justify-center">
                    <i class="fa fa-share-alt text-white"></i>
                  </div>
                  <h2 class="text-xl font-bold text-slate-800">分享列表</h2>
                </div>
                <div class="flex items-center gap-3">
                  <span id="shareCount" class="text-xs px-3 py-1 rounded-full bg-cyan-100 text-cyan-600">0</span>
                  <button class="refresh-btn p-2 rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-700 transition-all" data-refresh-target="shares" title="刷新">
                    <i class="fa fa-refresh"></i>
                  </button>
                </div>
              </div>
              
              <!-- 骨架屏 -->
              <div id="sharesSkeleton" class="max-h-[60vh] overflow-y-auto pr-2 scrollbar-thin">
                <div class="space-y-4">
                  <div class="share-card rounded-xl border border-slate-200 p-4 skeleton">
                    <div class="flex items-start gap-4">

    <script>
      const TOKEN_KEY = "userToken";
      const getToken = () => localStorage.getItem(TOKEN_KEY) || "";
      const token = getToken();
      if (!token) {
        const redirect = encodeURIComponent(window.location.pathname);
        window.location.href = `/login/index.html?redirect=${redirect}`;
      }
      const toast = (msg, type = 'info') => {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.className = `toast toast-${type}`;
        el.classList.remove("hidden");
        setTimeout(() => el.classList.add("hidden"), 2500);
      };
      const authHeaders = () => {
        const token = getToken();
        return token ? { Authorization: "Bearer " + token } : {};
      };
      const formatTime = (ts) => {
        if (!ts) return "-";
        const date = new Date(ts);
        if (Number.isNaN(date.getTime())) return "-";
        return date.toLocaleString();
      };
      const buildSharePlayUrl = (item) => {
        const shareId = String(item.shareId || "");
        if (!shareId) return "#";
        return `${window.location.origin}/video/share?sid=${encodeURIComponent(shareId)}`;
      };

      const parsePlayUrls = (rawUrl) => {
        const text = String(rawUrl || '');
        if (!text) return [];
        const segments = text.split('$$$').map(part => part.trim()).filter(Boolean);
        const preferredSegment = segments.find(seg => seg.toLowerCase().includes('m3u8')) || segments[0] || '';
        const parts = preferredSegment.split('#').map(part => part.trim()).filter(Boolean);
        return parts.map((part, index) => {
          const splitIndex = part.indexOf('$');
          if (splitIndex === -1) {
            return { name: `第${index + 1}集`, url: part };
          }
          const name = part.slice(0, splitIndex).trim() || `第${index + 1}集`;
          const url = part.slice(splitIndex + 1).trim();
          return { name, url };
        }).filter(item => item.url);
      };

      const isM3u8Url = (url) => {
        if (!url) return false;
        const cleaned = String(url).split('?')[0].split('#')[0].toLowerCase();
        return cleaned.endsWith('.m3u8');
      };

      const profileStatus = document.getElementById("profileStatus");
      const profileSummary = document.getElementById("profileSummary");
      const editNickname = document.getElementById("editNickname");
      const editAvatar = document.getElementById("editAvatar");
      const editProfileNote = document.getElementById("editProfileNote");
      const avatarPreview = document.getElementById("avatarPreview");
      const oldPassword = document.getElementById("oldPassword");
      const verifyPasswordBtn = document.getElementById("verifyPasswordBtn");
      const newPasswordFields = document.getElementById("newPasswordFields");
      const newPassword = document.getElementById("newPassword");
      const newPasswordConfirm = document.getElementById("newPasswordConfirm");
      const savePasswordBtn = document.getElementById("savePasswordBtn");
      const editSecurityQuestion = document.getElementById("editSecurityQuestion");
      const editSecurityAnswer = document.getElementById("editSecurityAnswer");
      const editSecurityQuestionPassword = document.getElementById("editSecurityQuestionPassword");
      const saveSecurityQuestionBtn = document.getElementById("saveSecurityQuestionBtn");
      const securityQuestionStatus = document.getElementById("securityQuestionStatus");
      const favoriteList = document.getElementById("favoriteList");
      const favoriteCount = document.getElementById("favoriteCount");
      const shareList = document.getElementById("shareList");
      const shareCount = document.getElementById("shareCount");
      const articleFavoriteList = document.getElementById("articleFavoriteList");
      const articleFavoriteStatus = document.getElementById("articleFavoriteStatus");
      const renewModal = document.getElementById("renewModal");
      const renewSelect = document.getElementById("renewSelect");
      const renewCustomMinutes = document.getElementById("renewCustomMinutes");
      const confirmRenewBtn = document.getElementById("confirmRenewBtn");
      const cancelRenewBtn = document.getElementById("cancelRenewBtn");
      const closeRenewModal = document.getElementById("closeRenewModal");
      const pauseShareBtn = document.getElementById("pauseShareBtn");

      let currentUser = null;
      let lastSavedProfile = { nickname: "", profileNote: "", avatar: "" };
      let renewTarget = null;
      let renewPaused = false;

      const setActiveModule = (name) => {
        document.querySelectorAll(".module-section").forEach((section) => {
          section.classList.toggle("hidden", section.getAttribute("data-module") !== name);
        });
        document.querySelectorAll(".module-tab").forEach((btn) => {
          const active = btn.getAttribute("data-module-target") === name;
          btn.className = active
            ? "module-tab w-full text-left px-4 py-3 rounded-xl text-sm font-medium bg-gradient-to-r from-blue-500 to-purple-600 text-white shadow-lg shadow-blue-500/25 transition-all"
            : "module-tab w-full text-left px-4 py-3 rounded-xl text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200 hover:shadow-md transition-all";
        });
      };

      document.querySelectorAll(".module-tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          setActiveModule(btn.getAttribute("data-module-target"));
          if (window.innerWidth < 768) {
            toggleMobileMenu(false);
          }
        });
      });

      const toggleMobileMenu = (open) => {
        const sideNav = document.getElementById("sideNav");
        const overlay = document.getElementById("sideNavOverlay");
        if (!sideNav || !overlay) return;
        const shouldOpen = open !== undefined ? open : sideNav.classList.contains("-translate-x-full");
        sideNav.classList.toggle("-translate-x-full", !shouldOpen);
        overlay.classList.toggle("hidden", !shouldOpen);
        document.body.classList.toggle("drawer-open", shouldOpen);
      };

      const renderProfile = (user) => {
        currentUser = user || null;
        const summary = [
          `账号：${user.username || "-"}`,
          `角色：${user.role || "user"}`,
          `创建时间：${formatTime(user.createdAt)}`,
          `最近活跃：${formatTime(user.lastSeenAt)}`,
          `状态：${user.isDisabled ? "已禁用" : "正常"}`,
        ].join(" · ");
        if (profileSummary) profileSummary.textContent = summary;
        if (editNickname) editNickname.value = user.nickname || "";
        if (editAvatar) editAvatar.value = user.avatar || "";
        if (editProfileNote) editProfileNote.value = user.profileNote || "";
        if (avatarPreview) avatarPreview.src = user.avatar || "https://via.placeholder.com/56";
        if (editSecurityQuestion) {
          editSecurityQuestion.value = user.securityQuestion || "";
        }
        if (editSecurityAnswer) editSecurityAnswer.value = "";
        lastSavedProfile = {
          nickname: user.nickname || "",
          profileNote: user.profileNote || "",
          avatar: user.avatar || "",
        };
        document.getElementById("profileSkeleton").classList.add("hidden");
        document.getElementById("profileContent").classList.remove("hidden");
      };

      const renderFavorites = (list) => {
        if (!favoriteList) return;
        document.getElementById("favoritesSkeleton").classList.add("hidden");
        document.getElementById("favoritesContent").classList.remove("hidden");
        if (!Array.isArray(list) || list.length === 0) {
          favoriteList.innerHTML = '<div class="text-center py-12"><div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fa fa-heart-o text-slate-400 text-2xl"></i></div><p class="text-slate-500">暂无喜欢</p><p class="text-sm text-slate-400 mt-1">收藏喜欢的视频后会显示在这里</p></div>';
          if (favoriteCount) favoriteCount.textContent = "0";
          return;
        }
        if (favoriteCount) favoriteCount.textContent = String(list.length);
        favoriteList.innerHTML = list
          .map(
            (item) => `
              <div class="favorite-card bg-slate-50/50 rounded-xl border border-slate-200 p-4 hover:shadow-lg hover:border-blue-200 transition-all">
                <img src="${item.pic || "https://via.placeholder.com/80x96"}" alt="" class="w-20 h-24 object-cover rounded-lg bg-slate-100 float-left mr-4" onerror="this.src='https://via.placeholder.com/80x96'">
                <div class="min-w-0">
                  <div class="text-sm font-medium text-slate-800 truncate">${item.title || "未命名"}</div>
                  <div class="text-xs text-slate-500 mt-1">来源：${item.source || "-"}</div>
                  <div class="text-xs text-slate-500 mt-1">收藏时间：${formatTime(item.timestamp)}</div>
                  <div class="mt-3 flex items-center gap-3 text-xs">
                    <button class="text-emerald-600 hover:text-emerald-700 font-medium flex items-center gap-1" data-action="play" data-url="${item.url || ""}" data-title="${item.title || ""}">
                      <i class="fa fa-play-circle"></i>播放
                    </button>
                    <button class="text-red-500 hover:text-red-600 font-medium flex items-center gap-1" data-action="delete-favorite" data-url="${item.url || ""}">
                      <i class="fa fa-trash"></i>删除
                    </button>
                  </div>
                </div>
              </div>
            `
          )
          .join("");
      };

      const renderShares = (list) => {
        if (!shareList) return;
        document.getElementById("sharesSkeleton").classList.add("hidden");
        document.getElementById("sharesContent").classList.remove("hidden");
        if (!Array.isArray(list) || list.length === 0) {
          shareList.innerHTML = '<div class="text-center py-12"><div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fa fa-share-alt-o text-slate-400 text-2xl"></i></div><p class="text-slate-500">暂无分享</p><p class="text-sm text-slate-400 mt-1">分享视频后会显示在这里</p></div>';
          if (shareCount) shareCount.textContent = "0";
          return;
        }
        if (shareCount) shareCount.textContent = String(list.length);
        shareList.innerHTML = list
          .map((item) => {
            const expiresAt = Number(item.expiresAt || 0);
            const paused = !!item.paused;
            const expired = paused || !!(expiresAt && Date.now() > expiresAt);
            const shareUrl = expired ? "#" : buildSharePlayUrl(item);
            return `
              <div class="share-card bg-slate-50/50 rounded-xl border border-slate-200 p-4 hover:shadow-lg hover:border-blue-200 transition-all" data-share-id="${item.shareId || ""}" data-expires-at="${expiresAt}" data-paused="${paused ? "1" : "0"}">
                <img src="${item.pic || "https://via.placeholder.com/96x128"}" alt="" class="w-24 h-32 object-cover rounded-lg bg-slate-100 float-left mr-4" onerror="this.src='https://via.placeholder.com/96x128'">
                <div class="min-w-0">
                  <div class="text-sm font-medium text-slate-800 truncate">${item.title || "未命名"}</div>
                  <div class="text-xs text-slate-500 mt-1 break-all">分享ID：${item.shareId || "-"}</div>
                  <div class="text-xs text-slate-500 mt-1">来源：${item.source || "-"}</div>
                  <div class="text-xs text-slate-500 mt-1">创建时间：${formatTime(item.createdAt)}</div>
                  <div class="text-xs text-slate-500 mt-1 share-expire">到期时间：${item.expiresAt ? formatTime(item.expiresAt) : "永久"}</div>
                  <div class="text-xs mt-1 share-status font-medium ${expired ? "text-red-500" : "text-emerald-500"}">${paused ? "已暂停" : (expired ? "已过期" : "可用")}</div>
                </div>
                <div class="clear-both mt-4 pt-4 border-t border-slate-200 flex items-center justify-between">
                  <div class="text-xs text-slate-500">浏览：${item.viewCount || 0}</div>
                  <div class="flex items-center gap-4 text-xs">
                    <button class="${paused ? "text-slate-400 cursor-not-allowed" : "text-emerald-600 hover:text-emerald-700 font-medium"} flex items-center gap-1" data-action="play" data-url="${item.url || ""}" data-title="${item.title || ""}" ${paused ? "disabled" : ""}>
                      <i class="fa fa-play-circle"></i>播放
                    </button>
                    <a href="${shareUrl}" target="_blank" class="${expired ? "text-slate-400 pointer-events-none" : "text-blue-600 hover:text-blue-700 font-medium"} flex items-center gap-1">
                      <i class="fa fa-external-link"></i>打开链接
                    </a>
                    <button class="text-indigo-600 hover:text-indigo-700 font-medium flex items-center gap-1" data-action="renew-share" data-share-id="${item.shareId || ""}">
                      <i class="fa fa-refresh"></i>续签
                    </button>
                    <button class="text-red-500 hover:text-red-600 font-medium flex items-center gap-1" data-action="delete-share" data-share-id="${item.shareId || ""}">
                      <i class="fa fa-trash"></i>删除
                    </button>
                  </div>
                </div>
              </div>
            `;
          })
          .join("");
      };

      const renderArticleFavorites = (list) => {
        if (!articleFavoriteList) return;
        document.getElementById("articleFavoritesSkeleton").classList.add("hidden");
        document.getElementById("articleFavoritesContent").classList.remove("hidden");
        if (!Array.isArray(list) || list.length === 0) {
          articleFavoriteList.innerHTML = '<div class="text-center py-12"><div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fa fa-bookmark-o text-slate-400 text-2xl"></i></div><p class="text-slate-500">暂无文章收藏</p><p class="text-sm text-slate-400 mt-1">收藏文章后会显示在这里</p></div>';
          if (articleFavoriteStatus) articleFavoriteStatus.textContent = "已加载";
          return;
        }
        if (articleFavoriteStatus) articleFavoriteStatus.textContent = `已加载 (${list.length})`;
        articleFavoriteList.innerHTML = list
          .map((article) => `
            <div class="article-favorite-card bg-slate-50/50 rounded-xl border border-slate-200 p-5 hover:shadow-lg hover:border-blue-200 transition-all">
              <div class="flex justify-between items-start">

      const debounce = (fn, wait) => {
        let t = null;
        return (...args) => {
          if (t) clearTimeout(t);
          t = setTimeout(() => fn(...args), wait);
        };
      };

        if (
          nickname === (lastSavedProfile.nickname || "") &&
          profileNote === (lastSavedProfile.profileNote || "") &&

          return;

      const openProfilePlayerWithUrl = (url, title = "") => {
        setTimeout(() => {
          const modal = document.getElementById("profilePlayerModal");
          const container = document.getElementById("profilePlayerContainer");
          const titleEl = document.getElementById("profilePlayerTitle");
          
          if (!modal || !container || !window.DPlayer) {
            console.error("播放器初始化失败：缺少必要元素或DPlayer库");
            toast("播放器初始化失败，请刷新页面重试", "error");
            return;
          }
          
          if (titleEl) titleEl.textContent = title || "播放";
          if (profilePlayerInstance) {
            profilePlayerInstance.destroy();
            profilePlayerInstance = null;
          }
          const safeUrl = String(url || "").trim();
          if (!safeUrl) {
            console.error("播放失败：视频URL为空");
            return;
          }
          const isHls = safeUrl.toLowerCase().includes(".m3u8");
          if (isHls && !window.Hls) {
            console.error("播放失败：HLS.js库未加载");
          }
          profilePlayerInstance = new DPlayer({
            container,
            video: isHls ? { url: safeUrl, type: "hls" } : { url: safeUrl },
            autoplay: true,
            pluginOptions: {
              hls: {
                maxBufferLength: 30,
                maxMaxBufferLength: 60
              }
            }
          });
          profilePlayerInstance.on('error', (error) => {
            if (isPlayerClosed) return;
            console.error("播放器错误：", error);
            toast("播放失败：" + (error.message || "未知错误"), "error");
          });
          profilePlayerInstance.on('play', () => {
            if (isPlayerClosed) return;
            console.log("视频开始播放");
          });
          modal.classList.remove("hidden");
          modal.classList.add("flex");
          document.body.style.overflow = "hidden";
        }, 100);
      };

        } else if (episodes.length === 1) {
          openProfilePlayerWithUrl(episodes[0].url, title);

              throw new Error(data.message || "续签失败");
            }
            const card = document.querySelector(`.share-card[data-share-id="${renewTarget}"]`);

          try {
            setButtonLoading(pauseShareBtn, true, nextPaused ? "暂停中..." : "恢复中...");
            const res = await fetch(`/api/user/shares/${encodeURIComponent(renewTarget)}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json", ...authHeaders() },
              body: JSON.stringify({ paused: nextPaused }),
            });
            const data = await res.json();
            if (data.code !== 200) {
              throw new Error(data.message || (nextPaused ? "暂停失败" : "恢复失败"));
            }
            const card = document.querySelector(`.share-card[data-share-id="${renewTarget}"]`);
            if (card) {
              const statusEl = card.querySelector(".share-status");
              const playBtn = card.querySelector('[data-action="play"]');
              const openLink = card.querySelector("a[href]");
              if (nextPaused) {
                if (statusEl) {
                  statusEl.textContent = "已暂停";
                  statusEl.classList.remove("text-emerald-500");
                  statusEl.classList.add("text-red-500");
                }
                if (playBtn) {
                  playBtn.disabled = true;
                  playBtn.classList.remove("text-emerald-600", "hover:text-emerald-700");
                  playBtn.classList.add("text-slate-400", "cursor-not-allowed");
                }
                if (openLink) {
                  openLink.setAttribute("href", "#");
                  openLink.classList.remove("text-blue-600", "hover:text-blue-700");
                  openLink.classList.add("text-slate-400", "pointer-events-none");
                }
                card.setAttribute("data-paused", "1");
              } else {
                if (statusEl) {
                  statusEl.textContent = "可用";
                  statusEl.classList.remove("text-red-500");
                  statusEl.classList.add("text-emerald-500");
                }
                if (playBtn) {
                  playBtn.disabled = false;
                  playBtn.classList.remove("text-slate-400", "cursor-not-allowed");
                  playBtn.classList.add("text-emerald-600", "hover:text-emerald-700");
                }
                if (openLink) {
                  const shareUrl = buildSharePlayUrl({ shareId: renewTarget });
                  openLink.setAttribute("href", shareUrl);
                  openLink.classList.remove("text-slate-400", "pointer-events-none");
                  openLink.classList.add("text-blue-600", "hover:text-blue-700");
                }
                card.setAttribute("data-paused", "0");
              }
            }
            if (renewModal) {
              renewModal.classList.add("hidden");
              renewModal.classList.remove("flex");
            }
            toast(nextPaused ? "分享已暂停" : "分享已恢复", "success");
          } catch (err) {
            toast(err.message || (nextPaused ? "暂停失败" : "恢复失败"), "error");
          } finally {
            setButtonLoading(pauseShareBtn, false);
          }
        });
      }

      document.getElementById("mobileMenuBtn").addEventListener("click", () => {
        toggleMobileMenu();
      });
      document.getElementById("sideNavOverlay").addEventListener("click", () => {
        toggleMobileMenu(false);
      });

      // 图片查看器功能
      const imageViewer = document.getElementById("imageViewer");
      const viewerImage = document.getElementById("viewerImage");
      const imageViewerTitle = document.getElementById("imageViewerTitle");
      const closeImageViewerBtn = document.getElementById("closeImageViewer");
      const prevImageBtn = document.getElementById("prevImageBtn");
      const nextImageBtn = document.getElementById("nextImageBtn");
      
      let currentImageIndex = 0;
      let currentImageList = [];

      const openImageViewer = (images, index = 0) => {
        if (!images || images.length === 0) return;
        currentImageList = images;
        currentImageIndex = Math.min(index, images.length - 1);
        viewerImage.src = images[currentImageIndex].url;
        imageViewerTitle.textContent = images[currentImageIndex].title || `图片 ${currentImageIndex + 1}/${images.length}`;
        imageViewer.classList.remove("hidden");
        imageViewer.classList.add("flex");
        document.body.style.overflow = "hidden";
      };

      const closeImageViewer = () => {
        imageViewer.classList.add("hidden");
        imageViewer.classList.remove("flex");
        document.body.style.overflow = "";
        viewerImage.src = "";
      };

      const navigateImage = (direction) => {
        if (currentImageList.length <= 1) return;
        if (direction === "next") {
          currentImageIndex = (currentImageIndex + 1) % currentImageList.length;
        } else {
          currentImageIndex = (currentImageIndex - 1 + currentImageList.length) % currentImageList.length;
        }
        viewerImage.src = currentImageList[currentImageIndex].url;
        imageViewerTitle.textContent = currentImageList[currentImageIndex].title || `图片 ${currentImageIndex + 1}/${currentImageList.length}`;
      };

      const bindImageClickEvents = () => {
        document.querySelectorAll('img[src]').forEach((img) => {
          if (img.classList.contains('no-zoom')) return;
          img.style.cursor = 'pointer';
          img.addEventListener('click', () => {
            const src = img.getAttribute('src');
            if (!src || src.startsWith('data:')) return;
            
            const title = img.getAttribute('alt') || img.getAttribute('title') || '';
            const images = [{ url: src, title }];
            
            openImageViewer(images, 0);
          });
        });
      };

      if (closeImageViewerBtn) {
        closeImageViewerBtn.addEventListener("click", closeImageViewer);
      }
      if (prevImageBtn) {
        prevImageBtn.addEventListener("click", () => navigateImage("prev"));
      }
      if (nextImageBtn) {
        nextImageBtn.addEventListener("click", () => navigateImage("next"));
      }

      imageViewer.addEventListener("click", (e) => {
        if (e.target === imageViewer) {
          closeImageViewer();
        }
      });

      document.addEventListener("keydown", (e) => {
        if (!imageViewer.classList.contains("hidden")) {
          if (e.key === "Escape") {
            closeImageViewer();
          } else if (e.key === "ArrowLeft") {
            navigateImage("prev");
          } else if (e.key === "ArrowRight") {
            navigateImage("next");
          }
        }
      });

      const loadAll = async () => {
        profileStatus.textContent = "加载中...";
        if (articleFavoriteStatus) articleFavoriteStatus.textContent = "加载中...";
        try {
          const [profileRes, favoritesRes, articleFavoritesRes, sharesRes] = await Promise.all([
            fetchJson("/api/user/profile"),
            fetchJson("/api/user/favorites"),
            fetchJson("/api/article/favorites"),
            fetchJson("/api/user/shares"),
          ]);
          renderProfile(profileRes.data || {});
          renderFavorites(favoritesRes.data || []);
          renderArticleFavorites(articleFavoritesRes.data || []);
          renderShares(sharesRes.data || []);
          bindPlayButtons();
          bindDeleteButtons();
          bindRenewButtons();
          bindImageClickEvents();
          profileStatus.textContent = "已加载";
          if (articleFavoriteStatus) articleFavoriteStatus.textContent = "已加载";
          await loadSecurityQuestions();
        } catch (err) {
          profileStatus.textContent = "加载失败";
          if (articleFavoriteStatus) articleFavoriteStatus.textContent = "加载失败";
          toast(err.message || "加载失败", "error");
        }
      };

      loadAll();
    </script>
  </body>
</html>
